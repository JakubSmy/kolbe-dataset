name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: make check
      - run: make zip
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/KOLBE.zip
          generate_release_notes: false
          body: "The submission is `KOLBE.zip`: the `KOLBE/` folder of this tag."
