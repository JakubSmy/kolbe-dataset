[project]
name = "kolbe-dataset"
version = "1.0.0"
description = "KOLBE: a synthetic AP/AR dataset for the Nanzen dataset challenge"
requires-python = ">=3.10"

[tool.ruff]
line-length = 140
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
ignore = ["E501", "E701", "E702", "E731", "E741", "B007"]
